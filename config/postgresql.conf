# =============================================================
# Production-like PostgreSQL Configuration
# Modeled after Google Cloud SQL defaults for a small instance
# =============================================================

# -- Connection Settings --
listen_addresses = '*'
max_connections = 100            # Cloud SQL default for db-f1-micro ~ 25, small ~ 100
port = 5432

# -- Memory --
shared_buffers = 128MB           # ~25% of available RAM (Cloud SQL auto-tunes this)
effective_cache_size = 256MB     # Hint to planner about OS cache
work_mem = 4MB                   # Per-operation sort/hash memory
maintenance_work_mem = 64MB      # For VACUUM, CREATE INDEX

# -- WAL (Write-Ahead Log) --
wal_level = replica              # Cloud SQL uses 'replica' for HA / read-replicas
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# -- Query Planner --
random_page_cost = 1.1           # SSD-optimized (Cloud SQL uses SSDs)
effective_io_concurrency = 200   # SSD setting

# -- Logging (production-style) --
logging_collector = off
# Logs go to stderr -> docker logs (standard for containers)
# log_directory = '/var/log/postgresql'
# log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'            # Log schema changes only (mod, ddl, all, none)
log_min_duration_statement = 250 # Log slow queries > 250ms
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0               # Log all temp file usage

# -- Locale --
timezone = 'UTC'                 # Always UTC in production
lc_messages = 'en_US.UTF-8'
