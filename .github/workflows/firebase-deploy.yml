name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "firebase.json"

  pull_request:
    types: [closed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build static export
        run: npx next build
        working-directory: dashboard

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/451451662791/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-hosting-deploy@project-ad7a5be2-a1c7-4510-82d.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project project-ad7a5be2-a1c7-4510-82d
