services:
  postgres:
    image: postgres:16-alpine
    container_name: learning_pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${PG_PASSWORD:-dev_secret_123}
      POSTGRES_DB: learning_db
    volumes:
      # Persist data across restarts
      - pg_data:/var/lib/postgresql/data
      # Custom PostgreSQL config (production-like)
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
      # Init scripts run once on first startup (alphabetical order)
      - ./init-scripts:/docker-entrypoint-initdb.d
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d learning_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Resource limits -- mimics Cloud SQL instance sizing
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  pg_data:
    driver: local
